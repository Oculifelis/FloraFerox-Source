modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
enumExtensions="META-INF/enumextensions.json"
authors="Oculifelis"
credits="Inspired by Violent Verdure, the Terraria mod by Violytta Ran"
description='''
Fierce flowers: the Pulse Gnat, the Dusk Sprig, the Moon Tick and the Mire Ghast, each its herb come alive. They spawn at night where their flowers grow, and picking a flower that looks like one of their
herbs can wake its family's monster. Each takes full damage only from its own family's class (melee, ranged, magic or
summon). Models, textures and code are original and generated by the scripts in tools/.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 1.6: the whips are Fundamentum's cord whips
[[dependencies.${mod_id}]]
    modId="fundamentum"
    type="required"
    versionRange="${fundamentum_range}"
    ordering="AFTER"
    side="BOTH"

# 1.5: the charm slots (Peace Lily and family charms). Required from 1.15.1: Fundamentum needs it anyway
[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[15.0.0,)"
    ordering="NONE"
    side="BOTH"

# 1.9: optional; with it the Grafting Bench's splices and the Weedwarden's job show in JEI (compat/VerdureJeiPlugin)
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[29.0.0,)"
    ordering="NONE"
    side="CLIENT"
